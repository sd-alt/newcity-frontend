name: 前端检查

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      backend_ref:
        description: 后端兼容版本（分支、标签或提交SHA）
        required: false
        default: ''
        type: string

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: 安装前端依赖
        run: npm ci

      - name: TypeScript 类型检查
        run: npm run typecheck

      - name: Vite 生产构建
        run: npm run build

      - name: 安装 Playwright 浏览器
        run: npx playwright install --with-deps chromium

      - name: Agent 动态任务图端到端测试
        run: npm run test:e2e

  integration:
    name: Vue-Django-MAF真实联调
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - name: 检出前端代码
        uses: actions/checkout@v4

      - name: 读取后端兼容版本
        id: backend-version
        shell: pwsh
        env:
          MANUAL_BACKEND_REF: ${{ inputs.backend_ref }}
        run: |
          $backendRef = $env:MANUAL_BACKEND_REF
          if ([string]::IsNullOrWhiteSpace($backendRef)) {
            $backendRef = (Get-Content -LiteralPath '.github/backend-agent.sha' -Raw).Trim()
          }
          if ([string]::IsNullOrWhiteSpace($backendRef)) {
            throw '后端兼容版本不能为空'
          }
          "ref=$backendRef" >> $env:GITHUB_OUTPUT
          "## 真实联调兼容版本" >> $env:GITHUB_STEP_SUMMARY
          "- 前端提交：$env:GITHUB_SHA" >> $env:GITHUB_STEP_SUMMARY
          "- 后端引用：$backendRef" >> $env:GITHUB_STEP_SUMMARY
          "- 图Schema：task-graph-schema-v2" >> $env:GITHUB_STEP_SUMMARY
          "- Planning Prompt：newcity-planning-v0.2" >> $env:GITHUB_STEP_SUMMARY
          "- Execution Prompt：newcity-execution-v0.2" >> $env:GITHUB_STEP_SUMMARY
          "- 数据库迁移：operations.0046" >> $env:GITHUB_STEP_SUMMARY

      - name: 检出固定后端兼容版本
        uses: actions/checkout@v4
        with:
          repository: sd-alt/newcity
          ref: ${{ steps.backend-version.outputs.ref }}
          path: newcity
          token: ${{ secrets.NEWCITY_REPO_READ_TOKEN }}

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装 uv
        uses: astral-sh/setup-uv@v5

      - name: 安装后端依赖
        working-directory: newcity
        run: uv sync --frozen

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: 安装前端依赖
        run: npm ci

      - name: 安装 Playwright 浏览器
        run: npx playwright install --with-deps chromium

      - name: Vue-Django-Worker-MAF真实联调
        env:
          NEWCITY_INTEGRATION_BACKEND_ROOT: ${{ github.workspace }}\newcity
        run: npm run test:e2e:integration
